services:
  - type: web
    name: openjarvis
    runtime: docker
    dockerfilePath: deploy/docker/Dockerfile
    dockerContext: .
    plan: free
    branch: claude/openjarvis-setup-jc92so
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENJARVIS_API_KEY
        generateValue: true
    healthCheckPath: /health
